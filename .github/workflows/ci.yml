name: CI Pipeline (Lint & Tests)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff linter
        run: pip install ruff

      - name: Run Ruff checks
        run: ruff check .

  test:
    name: Automated Unit & Integration Tests (Pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run test suite with coverage
        run: |
          pytest --cov=livraison_express_lite tests/ --cov-report=term-missing --cov-report=xml

      - name: Verify CLI commands
        run: |
          python -m livraison_express predict --file order.json

