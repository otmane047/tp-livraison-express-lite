version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: livraison-express-lite:latest
    container_name: livraison-express-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - MODEL_THRESHOLD=0.5
      - MODEL_PATH=notebooks/artifacts/express_delivery_model.joblib
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ml-network

  # Optionnel : Serveur de tracking MLflow local
  mlflow:
    image: python:3.10-slim
    container_name: livraison-express-mlflow
    command: >
      sh -c "pip install --no-cache-dir mlflow &&
             mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlruns
    networks:
      - ml-network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  ml-network:
    driver: bridge

volumes:
  mlflow-data:
